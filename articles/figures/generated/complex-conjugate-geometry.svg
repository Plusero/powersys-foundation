 <title id="complex-conjugate-geometry-title">Geometric interpretation of a complex conjugate</title><desc id="complex-conjugate-geometry-description">The complex number z equals a plus j b and is drawn above the real axis at angle theta. Its conjugate z star equals a minus j b and is drawn below the real axis at angle minus theta. The arrows have equal length and the same real component a, while their imaginary components are plus b and minus b. A vertical double arrow indicates reflection across the real axis.</desc><metadata>

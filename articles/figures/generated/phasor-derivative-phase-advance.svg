 <title id="phasor-derivative-phase-advance-title">Multiplication by j advances a phasor by 90 degrees</title><desc id="phasor-derivative-phase-advance-description">The input phasor X is an arrow at angle theta. A counterclockwise arc arrow labelled multiply by j and a right-angle marker show the phase advance of 90 degrees. A dot at the same radius marks jX and demonstrates that multiplication by j does not change magnitude. The derivative phasor j omega X lies on the same ray at angle theta plus 90 degrees and has magnitude omega times the magnitude of X.</desc><metadata>

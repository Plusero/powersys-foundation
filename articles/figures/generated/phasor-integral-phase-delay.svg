 <title id="phasor-integral-phase-delay-title">Division by j delays a phasor by 90 degrees</title><desc id="phasor-integral-phase-delay-description">The input phasor X is an arrow at angle theta. A clockwise arc arrow labelled divide by j and a right-angle marker show the phase delay of 90 degrees. A dot at the same radius marks minus jX, equal to X divided by j, and demonstrates that division by j does not change magnitude. The integral phasor X divided by j omega lies on the same ray at angle theta minus 90 degrees and has magnitude equal to the magnitude of X divided by omega.</desc><metadata>

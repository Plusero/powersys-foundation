 <title id="phasor-geometry-title">Geometric interpretation of a voltage phasor</title><desc id="phasor-geometry-description">A fixed voltage phasor is drawn as an arrow in the complex plane. Its length is the RMS magnitude V and its angle from the positive real axis is theta sub v. Its dashed horizontal projection is V cosine theta sub v, and its dashed vertical projection is V sine theta sub v. A light curved arrow is labelled omega.</desc><metadata>

  <text x="110" y="269" font-family="Times New Roman" font-size="24" font-weight="bold" text-anchor="middle" fill="#111111">G</text>
  <polygon points="1144,330 1176,330 1160,358" fill="#111111" />
  <text x="640" y="64" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">System base: 100 MVA</text>
  <text x="110" y="120" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Generator G</text>
  <text x="110" y="146" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">90 MVA, 13.8 kV</text>
  <text x="110" y="170" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">x″ = j0.18 p.u.</text>
  <text x="317" y="120" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">T1</text>
  <text x="317" y="146" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">125 MVA, 13.2/230 kV</text>
  <text x="317" y="170" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">x = j0.10 p.u.</text>
  <text x="655" y="120" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">230 kV line</text>
  <text x="655" y="146" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">z = 15 + j80 Ω</text>
  <text x="655" y="170" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">bc = 422 µS total</text>
  <text x="931" y="120" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">T2</text>
  <text x="931" y="146" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">75 MVA, 230/69 kV</text>
  <text x="931" y="170" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">x = j0.08 p.u.</text>
  <text x="200" y="196" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Bus 1</text>
  <text x="470" y="196" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Bus 2</text>
  <text x="840" y="196" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Bus 3</text>
  <text x="1080" y="196" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Bus 4</text>
  <text x="566" y="338" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="start" fill="#43515a">bc/2</text>
  <text x="796" y="338" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="start" fill="#43515a">bc/2</text>
  <text x="1140" y="300" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="end" fill="#111111">Load</text>
  <text x="1140" y="326" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="end" fill="#43515a">60 + j25 MVA</text>
  <text x="1140" y="350" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="end" fill="#43515a">at 66 kV</text>
  <text x="230" y="420" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Generator zone</text>
  <text x="230" y="446" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">VB = 13.2 kV</text>
  <text x="624" y="420" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Transmission zone</text>
  <text x="624" y="446" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">VB = 230 kV</text>
  <text x="1060" y="420" font-family="Times New Roman" font-size="20" font-weight="bold" text-anchor="middle" fill="#111111">Distribution zone</text>
  <text x="1060" y="446" font-family="Times New Roman" font-size="18" font-weight="normal" text-anchor="middle" fill="#43515a">VB = 69 kV</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="per-unit-four-bus-network-title per-unit-four-bus-network-description">
  <title id="per-unit-four-bus-network-title">Four-bus network spanning three per-unit voltage zones</title>
  <desc id="per-unit-four-bus-network-description">Radial single-line diagram. Generator G at bus 1 connects through step-up transformer T1 to bus 2, a 230 kV line with a charging capacitance at each end runs to bus 3, and step-down transformer T2 feeds the load at bus 4. Dashed boundaries through both transformers separate the generator, transmission, and distribution zones, whose voltage bases are 13.2 kV, 230 kV, and 69 kV on a 100 MVA system base.</desc>

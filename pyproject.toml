[project]
name = "powersys-foundation"
version = "0.1.0"
description = "Executable examples for the Power Systems Foundation tutorials"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jupyter>=1.1,<2",
  "matplotlib>=3.11.1",
  "numpy>=2.0,<3",
  "pandapower>=3.5,<4",
  "power-grid-model>=1.13.116,<2",
  "schemdraw>=0.23,<0.24",
  "scienceplots>=2.2.2",
]

[tool.uv]
package = false

